services:
  # FastAPI Backend Service
  - type: web
    name: rad-uniqa-backend
    runtime: python
    rootDir: RAD-UniQA
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: LLM_PROVIDER
        value: "auto"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        value: "local"
